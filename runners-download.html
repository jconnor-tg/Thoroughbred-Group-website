<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runners Data | The Thoroughbred Group</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- DataTables CSS for interactivity and export buttons -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">
</head>
<body>

    <!-- Header without navigation -->
    <header class="site-header">
        <div class="container">
            <div class="logo">
                <a href="index.html">
                    <img src="images/TG logo for header.jpg" alt="The Thoroughbred Group">
                </a>
            </div>
        </div>
    </header>

    <section class="news-section">
        <div class="container">
            <h1>Runners Data Export</h1>
            
            <div class="text-content" style="margin-bottom: 20px;">
                <p>Use the search and sort features below to filter the dataset. Click the buttons to download the data directly to your device.</p>
            </div>

            <!-- The Interactive Data Table -->
            <table id="runnersTable" class="display" style="width:100%">
                <thead>
                    <tr>
                        <!-- Adjust these headers based on the specific columns in your Power BI dataset -->
                        <th>Horse Name</th>
                        <th>Trainer</th>
                        <th>Owner</th>
                        <th>Official Rating</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data will populate here -->
                </tbody>
            </table>

        </div>
    </section>

    <!-- Existing Footer -->
    <footer>
        <div class="container">
            <p>
                &copy; 2026 Thoroughbred Group. All rights reserved. 
                | <a href="privacy.html" class="footer-link">Privacy Policy</a>
            </p>
            <div class="social-links">
                <a href="https://x.com/Thoroughbred_Gp" target="_blank" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="https://www.linkedin.com/company/thoroughbredgroup/" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
            </div>
        </div>
    </footer>

    <!-- jQuery and DataTables Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>

    <!-- Initialize the Table -->
    <script>
        $(document).ready(function() {
            $('#runnersTable').DataTable({
                dom: 'Bfrtip',
                buttons: [
                    'copyHtml5',
                    'excelHtml5',
                    'csvHtml5'
                ],
                // Points to the specific JSON file for this page
                ajax: 'data/runners-data.json' 
            });
        });
    </script>
</body>
</html>
